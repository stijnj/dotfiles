# ~/.config/starship.toml — managed by chezmoi. Edit the source, not this file:
#   chezmoi edit ~/.config/starship.toml
#
# Powerline ribbon: os > time > directory > git. Needs a Nerd Font; Ghostty is
# already on JetBrainsMono Nerd Font.

add_newline = true
command_timeout = 500

format = """
(green)\
$os\
[](fg:green bg:surface0)\
$time\
[](fg:surface0 bg:blue)\
$directory\
[](fg:blue bg:yellow)\
${custom.git_host}\
$git_branch\
$git_status\
[](fg:yellow)\
 $character
"""

# ── Catppuccin Macchiato ───────────────────────────────────────────────
palette = "catppuccin_macchiato"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo  = "#f0c6c6"
pink      = "#f5bde6"
mauve     = "#c6a0f6"
red       = "#ed8796"
maroon    = "#ee99a0"
peach     = "#f5a97f"
yellow    = "#eed49f"
green     = "#a6da95"
teal      = "#8bd5ca"
sky       = "#91d7e3"
sapphire  = "#7dc4e4"
blue      = "#8aadf4"
lavender  = "#b7bdf8"
text      = "#cad3f5"
subtext0  = "#a5adcb"
overlay0  = "#6e738d"
surface2  = "#5b6078"
surface1  = "#494d64"
surface0  = "#363a4f"
base      = "#24273a"
mantle    = "#1e2030"
crust     = "#181926"

# ── Segments ───────────────────────────────────────────────────────────
[os]
disabled = false
format = "[ $symbol ](fg:crust bg:green)"

[os.symbols]
Macos   = ""
Linux   = ""
Ubuntu  = ""
Debian  = ""
Windows = "󰂥"

[time]
disabled = false
time_format = "%R"
format = "[  $time ](fg:teal bg:surface0)"

[directory]
format = "[  $path$read_only ](fg:crust bg:blue)"
read_only = " "
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Developer" = ""

# Icon for the host behind `origin`. `require_repo` keeps starship from
# spawning a shell outside git repos, so a plain prompt costs nothing extra.
[custom.git_host]
description = "Git hosting provider icon"
require_repo = true
when = true
command = """case "$(git remote get-url origin 2>/dev/null)" in
  *github*)    printf '' ;;
  *gitlab*)    printf '' ;;
  *bitbucket*) printf '' ;;
  *)           printf '' ;;
esac"""
format = "[ $output ](fg:crust bg:yellow)"

[git_branch]
symbol = ""
format = "[$symbol $branch ](fg:crust bg:yellow)"

[git_status]
format = "[$all_status$ahead_behind](fg:crust bg:yellow)"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = ""
untracked  = "? "
modified   = " "
stashed    = " "
staged     = " "
renamed    = " "
deleted    = " "

[character]
success_symbol = "[→](bold teal)"
error_symbol   = "[→](bold red)"
